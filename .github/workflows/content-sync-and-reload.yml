name: Sync content to server and reload website

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "content/blog/**"
      - "content/notes/**"

jobs:
  sync-and-reload:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      CONTENT_REPO_DIR: ${{ secrets.CONTENT_REPO_DIR || '/opt/aether_garden/aether_garden.content' }}
      WEBSITE_RELOAD_URL: ${{ secrets.WEBSITE_RELOAD_URL }}
      WEBSITE_RELOAD_TOKEN: ${{ secrets.WEBSITE_RELOAD_TOKEN }}
    steps:
      - name: Configure SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          KEY_MATERIAL="${{ secrets.DEPLOY_SSH_KEY }}"
          if [[ "$KEY_MATERIAL" == *"BEGIN OPENSSH PRIVATE KEY"* || "$KEY_MATERIAL" == *"BEGIN RSA PRIVATE KEY"* || "$KEY_MATERIAL" == *"BEGIN EC PRIVATE KEY"* || "$KEY_MATERIAL" == *"BEGIN PRIVATE KEY"* ]]; then
            printf '%s\n' "$KEY_MATERIAL" | tr -d '\r' > ~/.ssh/id_ed25519
          else
            printf '%s' "$KEY_MATERIAL" | tr -d '\r' | base64 -d > ~/.ssh/id_ed25519
          fi

          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Sync server content repo to pushed commit
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; cd '$CONTENT_REPO_DIR'; git config --global --add safe.directory '$CONTENT_REPO_DIR'; git fetch --all --prune; git checkout '${{ github.sha }}'"

      - name: Trigger backend content reload
        run: |
          curl -sS -X POST "$WEBSITE_RELOAD_URL" \
            -H "X-Reload-Token: $WEBSITE_RELOAD_TOKEN" \
            -H "Content-Type: application/json" \
            --retry 3 \
            --retry-delay 2 \
            --retry-connrefused \
            --fail
